
apiVersion: batch/v1
kind: CronJob
metadata:
  name: llama-fine-tune
spec:
  schedule: "0 2 1 * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: fine-tuner
            image: ahrn/llama-finetune:latest
            resources:
              limits:
                nvidia.com/gpu: 1
          restartPolicy: OnFailure
